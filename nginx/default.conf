# Static hosting for the MindSpa POC installable web app.
#
# Two caching rules matter: hashed assets are immutable and can be cached for a year,
# while the HTML shell and the version file must never be cached, or a visitor keeps a
# stale shell that points at assets that no longer exist after a deploy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A plain liveness endpoint, so a platform health check does not have to parse the
    # app shell or depend on the JavaScript bundle.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /audio/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
