# Included in every location: nginx drops inherited add_header lines once a location
# sets its own, so these are repeated rather than declared once at the server level.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The app is a static bundle with no inline event handlers, so a strict policy is
# affordable. data: is allowed for images because the mascot and the mood faces are
# inline SVG, and the audio sources are same origin or the demo bucket.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
